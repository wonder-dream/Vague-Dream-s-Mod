[project]
name = "vague-dream-s-mod-backend"
version = "0.1.0"
description = "Vague-Dream-s-Mod 后端服务"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.136.1",
    "uvicorn>=0.46.0",
]

# 关键：声明 workspace，成员在 packages/* 目录下
[tool.uv.workspace]
members = ["packages/*"]

# 关键：根包本身不生成可安装包
[tool.uv]
package = false