[project]
name = "app"
version = "0.1.0"
description = "FastAPI 主应用"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.136.1",
    "uvicorn>=0.46.0",
    "apscheduler>=3.11",
    "python-multipart>=0.0.20",
    "core",  # 依赖本地 core 包
]

# 关键：声明 core 来自本地 workspace
[tool.uv.sources]
core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]