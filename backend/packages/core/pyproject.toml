[project]
name = "core"
version = "0.1.0"
description = "核心共享库"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pydantic>=2.11",
    "pydantic-settings>=2.0",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "python-jose[cryptography]>=3.4",
    "passlib[bcrypt]>=1.7",
    "python-multipart>=0.0.20",
    "email-validator>=2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/core"]